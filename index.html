<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potluck — Shared Weekly Trace</title>
<style>
:root{--bg:#f4f1ea;--paper:#fbfaf6;--ink:#1d1d1a;--muted:#77736b;--line:#d7d2c8;--soft:#ebe7de;--r:18px}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,textarea{font:inherit;color:inherit} button{cursor:pointer}
.shell{max-width:1180px;margin:auto;padding:22px 20px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{font:600 20px Georgia,serif}.muted{color:var(--muted)}.tiny{font-size:12px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:Georgia,serif;font-weight:500;margin:0} h1{font-size:clamp(32px,6vw,56px);line-height:1.02} h2{font-size:27px} h3{font-size:20px}
.pill,.add{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px}.add{background:var(--ink);color:white;border-color:var(--ink)}
.weeknav{display:flex;gap:10px;align-items:center}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:26px 0 22px}
.member-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.member{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:18px;min-height:220px;text-align:left;transition:.15s}
.member:hover{transform:translateY(-1px);border-color:#aaa49a}.member-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font:600 12px Georgia,serif}.trace{padding:9px 0;border-top:1px solid var(--line)}
.trace:first-of-type{border-top:0}.type{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.trace-text{font:17px/1.35 Georgia,serif}
.more{margin-top:10px;font-size:12px;color:var(--muted)}.screen{display:none}.screen.active{display:block}
.back{border:0;background:none;padding:0;color:var(--muted);margin-bottom:22px}.person-title{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.quadrant{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:18px;min-height:190px}
.qhead{display:flex;justify-content:space-between;margin-bottom:10px}.qitems{display:grid;gap:8px}.qitem{border:0;background:transparent;text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.qitem:first-child{border-top:0}.qitem span{font:16px/1.35 Georgia,serif}.detail{max-width:720px;margin:0 auto}.detail-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.detail-text{font:clamp(24px,4vw,34px)/1.3 Georgia,serif;margin:14px 0 28px}.comments{border-top:1px solid var(--line);padding-top:18px}.comment{padding:12px 0;border-bottom:1px solid var(--line)}
.reply{display:flex;gap:8px;margin-top:18px}.reply textarea{flex:1;min-height:54px;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;resize:vertical}
.reply button{align-self:flex-end}.modal{position:fixed;inset:0;background:#0003;display:none;place-items:center;padding:20px}.modal.show{display:grid}.box{width:min(560px,100%);background:var(--paper);border-radius:20px;padding:22px}
.box textarea{width:100%;min-height:130px;margin:16px 0;border:1px solid var(--line);border-radius:12px;padding:12px;background:white}.types{display:flex;gap:7px;flex-wrap:wrap}.types button.active{background:var(--ink);color:white}
@media(min-width:900px){.member-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.shell{padding:16px 12px 60px}.top{align-items:flex-start}.hero{align-items:flex-start;flex-direction:column}.member-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.member{padding:13px;min-height:205px}.trace-text{font-size:15px}.matrix{grid-template-columns:1fr 1fr;gap:8px}.quadrant{padding:13px;min-height:170px}.qitem span{font-size:14px}}

@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-SemiBold.woff') format('woff');font-weight:600;font-display:swap}
@font-face{font-family:'ChosunIlboMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');font-weight:400;font-display:swap}
:root{--bg:#f7f7f4;--surface:#fff;--ink:#171717;--muted:#77736d;--line:#e3e1dc;--accent:#c95f43}
html,body{background:var(--bg)!important;color:var(--ink)!important}
body,button,input,textarea{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important}
h1{font-family:'ChosunIlboMyungjo',serif!important;font-weight:400!important;letter-spacing:-.025em}
.brand{font-family:'Pretendard',sans-serif!important;font-weight:600!important}
.member-grid{gap:0!important;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.member{border:0!important;border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;box-shadow:none!important}
.member:hover{background:rgba(255,255,255,.65)!important;transform:none!important}
.trace,.qitem{border-color:var(--line)!important}
.trace-text,.qitem,.detail-text{font-family:'Pretendard',sans-serif!important}
.avatar{background:var(--surface)!important;border:1px solid var(--line)}
#openAdd,.primary{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
.matrix{gap:0!important;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.quadrant{border:0!important;border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;min-height:0!important}
@media(max-width:700px){.member-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.matrix{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand">Potluck</div><div class="weeknav"><button class="pill">Creative Circle</button><button class="add" id="openAdd">Bring something</button></div></header>

<section id="home" class="screen active">
  <div class="hero"><div><div class="eyebrow">Sep 1 — 7</div><h1>What has everyone<br>been up to?</h1></div><div class="muted tiny">Creative Circle · 6 people · demo</div></div>
  <div id="memberGrid" class="member-grid"></div>
</section>

<section id="person" class="screen">
  <button class="back" data-back="home">← Our week</button>
  <div class="person-title"><div class="avatar" id="personAvatar"></div><div><div class="eyebrow">This week</div><h2 id="personName"></h2></div></div>
  <p class="muted">A week at a glance. Open a trace only when you want the context or conversation.</p>
  <div id="matrix" class="matrix"></div>
</section>

<section id="detail" class="screen">
  <button class="back" data-back="person">← Back to week</button>
  <div class="detail"><div class="detail-card">
    <div class="eyebrow" id="detailMeta"></div><div class="detail-text" id="detailText"></div>
    <div class="comments"><h3>Conversation</h3><div id="commentList"></div>
      <div class="reply"><textarea id="replyText" placeholder="Reply…"></textarea><button class="add" id="replyBtn">Send</button></div>
    </div>
  </div></div>
</section>
</div>

<div class="modal" id="modal"><div class="box"><div class="eyebrow">Add to Creative Circle</div><h2>What happened?</h2>
<div class="types" id="typeButtons"></div><textarea id="newText" placeholder="Something you made, learned, thought about, or got stuck on…"></textarea>
<div style="display:flex;justify-content:flex-end;gap:8px"><button class="pill" id="cancel">Cancel</button><button class="add" id="save">Add trace</button></div></div></div>


<script>
const types=["Made","Learned","Thought","Stuck"];
const people=[{"name": "James", "initial": "J", "items": [{"type": "Made", "text": "Reframed the weekly reflection prototype around shared traces.", "comments": ["Min: The archive angle makes more sense to me."]}, {"type": "Thought", "text": "Why would anyone open this instead of a group chat?", "comments": []}, {"type": "Learned", "text": "A layout decision needs an information reason, not just a visual one.", "comments": []}, {"type": "Stuck", "text": "How much structure can the app add before posting starts to feel like work?", "comments": []}, {"type": "Thought", "text": "Maybe ambient accountability is a side effect, not the product promise.", "comments": []}]}, {"name": "Min", "initial": "M", "items": [{"type": "Made", "text": "Rewrote the opening of my portfolio case study.", "comments": ["James: Show me the new intro when you have time."]}, {"type": "Thought", "text": "Starting to wonder whether strategy fits me better than product.", "comments": []}, {"type": "Learned", "text": "Talked with a PM about how recruiting actually works.", "comments": []}]}, {"name": "Alex", "initial": "A", "items": [{"type": "Learned", "text": "Built my first small RAG pipeline and finally understood retrieval.", "comments": []}, {"type": "Stuck", "text": "My thesis scope is still too broad.", "comments": ["June: Same problem. Want to compare outlines?"]}, {"type": "Made", "text": "Finished a rough thesis research plan.", "comments": []}]}, {"name": "June", "initial": "J", "items": [{"type": "Made", "text": "Shot and edited a 40-second motion study.", "comments": []}, {"type": "Learned", "text": "Started learning Blender lighting.", "comments": []}, {"type": "Thought", "text": "I keep wanting to combine physical installations with projection.", "comments": []}]}, {"name": "Dan", "initial": "D", "items": [{"type": "Stuck", "text": "Interview prep keeps expanding instead of getting more focused.", "comments": []}, {"type": "Made", "text": "Sent two applications I had been sitting on.", "comments": []}]}, {"name": "Chris", "initial": "C", "items": [{"type": "Thought", "text": "What would a portfolio look like if it showed unfinished thinking too?", "comments": []}, {"type": "Learned", "text": "Read about context collapse and smaller-audience sharing.", "comments": []}, {"type": "Made", "text": "Started collecting references for a new personal site.", "comments": []}]}];
let currentPerson=0,currentItem=0,selectedType="Thought";
const $=s=>document.querySelector(s);
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$("#"+id).classList.add("active");window.scrollTo(0,0)}
function renderHome(){
 $("#memberGrid").innerHTML=people.map((p,i)=>{
   const chosen=[]; types.forEach(t=>{const x=p.items.find(v=>v.type===t);if(x&&chosen.length<3)chosen.push(x)});
   return `<button class="member" onclick="openPerson(${i})"><div class="member-head"><div><div class="eyebrow">This week</div><h3>${p.name}</h3></div><div class="avatar">${p.initial}</div></div>
   ${chosen.map(x=>`<div class="trace"><div class="type">${x.type}</div><div class="trace-text">${x.text}</div></div>`).join("")}
   ${p.items.length>chosen.length?`<div class="more">+ ${p.items.length-chosen.length} more</div>`:""}</button>`
 }).join("")
}
window.openPerson=i=>{currentPerson=i;const p=people[i];$("#personName").textContent=p.name;$("#personAvatar").textContent=p.initial;
 $("#matrix").innerHTML=types.map(t=>{const arr=p.items.map((x,idx)=>({...x,idx})).filter(x=>x.type===t);
 return `<div class="quadrant"><div class="qhead"><div class="eyebrow">${t}</div><div class="tiny muted">${arr.length||""}</div></div><div class="qitems">${arr.length?arr.map(x=>`<button class="qitem" onclick="openDetail(${x.idx})"><span>${x.text}</span></button>`).join(""):`<div class="muted tiny">Nothing here this week.</div>`}</div></div>`}).join("");show("person")}
window.openDetail=idx=>{currentItem=idx;const p=people[currentPerson],x=p.items[idx];$("#detailMeta").textContent=`${p.name} · ${x.type} · Sep 3`;$("#detailText").textContent=x.text;renderComments();show("detail")}
function renderComments(){const x=people[currentPerson].items[currentItem];$("#commentList").innerHTML=x.comments.length?x.comments.map(c=>`<div class="comment">${c}</div>`).join(""):`<div class="muted tiny" style="padding:14px 0">No replies yet.</div>`}
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>show(b.dataset.back));
$("#replyBtn").onclick=()=>{const v=$("#replyText").value.trim();if(!v)return;people[currentPerson].items[currentItem].comments.push("You: "+v);$("#replyText").value="";renderComments()}
function renderTypes(){$("#typeButtons").innerHTML=types.map(t=>`<button class="pill ${t===selectedType?"active":""}" onclick="pickType('${t}')">${t}</button>`).join("")}
window.pickType=t=>{selectedType=t;renderTypes()}
$("#openAdd").onclick=()=>{$("#modal").classList.add("show");renderTypes()}
$("#cancel").onclick=()=>$("#modal").classList.remove("show");
$("#save").onclick=()=>{const v=$("#newText").value.trim();if(!v)return;people[0].items.unshift({type:selectedType,text:v,comments:[]});$("#newText").value="";$("#modal").classList.remove("show");renderHome()}
renderHome();
</script>

</body>
</html>
